---
layout: default
---
<section class="container" style="max-width: 900px; margin: 0 auto; padding-top: 40px; padding-bottom: 60px; font-family: 'Courier New', monospace;">
    
    <div style="margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px;">
        <div style="color: #666; font-size: 0.9rem; margin-bottom: 15px;">
            <span style="color: #00ff41; margin-right: 10px;">root@kaiversus:~/writeups$</span> cat {{ page.title | slugify }}.md
        </div>
        <h1 style="color: #fff; font-size: 2.2rem; margin-bottom: 10px; font-weight: bold; font-family: 'Courier New', monospace;">
            {{ page.title }}
        </h1>
        <div style="color: #888; font-size: 0.85rem;">
            [ CREATED: {{ page.date | date: "%Y-%m-%d" }} ] 
            {% if page.category %} | [ TAGS: <span style="color: #00ff41;">{{ page.category }}</span> ]{% endif %}
        </div>
    </div>

    <article class="markdown-terminal">
        {{ content }}
    </article>
    
    <div style="margin-top: 60px; padding-top: 20px; border-top: 1px dashed rgba(255,255,255,0.1); text-align: left;">
        <a href="/writeups/" style="color: #666; text-decoration: none; transition: 0.3s;" onmouseover="this.style.color='#00ff41'" onmouseout="this.style.color='#666'">[ cd .. ] Return to Writeups</a>
    </div>

</section>
