<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Kaiversus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Oxanium:wght@700;800&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
</head>
<body>

    <div class="container" style="padding-top: 2px; padding-bottom: 2px;">
        <header>
            <a href="/" class="logo" style="text-decoration: none;">KAIVERSUS</a>
            <nav>
                <a href="/">Homepage</a>
                <a href="/about/">About_me</a> 
                <a href="/writeups/">Writeups</a>
            </nav>
        </header>
    </div>

    <section class="container" style="margin-top: 40px; min-height: 70vh;">
        <div style="margin-bottom: 30px; border-bottom: 1px dashed #333; padding-bottom: 20px;">
            <div style="font-family: 'Courier New', monospace; color: #888; font-size: 0.9rem; margin-bottom: 15px;">
                <span style="color: var(--primary); margin-right: 10px;">root@kaiversus:~/writeups$</span> cat {{ page.title | slugify }}.md
            </div>
            <h1 style="color: #fff; font-size: 2.2rem; margin-bottom: 10px; font-family: 'Orbitron', sans-serif;">{{ page.title }}</h1>
            <div style="color: var(--accent); font-family: 'Courier New', monospace; font-size: 0.9rem;">
                [ CREATED: {{ page.date | date: "%Y-%m-%d" }} ]
            </div>
        </div>

        <article class="sys-reader-body" style="background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 30px; margin-bottom: 40px;">
            {{ content }}
        </article>

        <div style="text-align: center; margin-bottom: 50px;">
            <a href="/writeups/" class="btn-cyber secondary"><< RETURN_TO_DIR</a>
        </div>
    </section>

    <footer style="text-align: center; padding: 30px; color: #555; border-top: 1px solid #111;">
        <p style="font-family: 'Courier New', monospace;">[ EOF ]</p>
    </footer>

</body>
</html>
