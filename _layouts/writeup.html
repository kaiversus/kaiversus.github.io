---
layout: default
---
<style>
/* ── Writeup green overrides ── */

/* Bold — green accent */
.writeup-content strong,
.writeup-content b {
  font-weight: 800;
  color: #7ee787;
}

html.light .writeup-content strong,
html.light .writeup-content b {
  color: #1a5c22;
}

/* Inline code — green tinted */
.writeup-content p code,
.writeup-content li code,
.writeup-content td code {
  background: rgba(63, 185, 80, 0.08);
  color: #7ee787;
  border: 1px solid rgba(63, 185, 80, 0.15);
}

html.light .writeup-content p code,
html.light .writeup-content li code,
html.light .writeup-content td code {
  background: rgba(30, 110, 40, 0.07);
  color: #1a5c22;
  border: 1px solid rgba(30, 110, 40, 0.12);
}

/* Table header — green */
.writeup-content th {
  background: rgba(63, 185, 80, 0.08) !important;
  color: #3fb950 !important;
}

html.light .writeup-content th {
  background: rgba(30, 110, 40, 0.07) !important;
  color: #1e6e28 !important;
}
</style>

<div class="writeup-container">
    
    <article class="writeup-content">
        <div class="writeup-header">
            <div class="terminal-prompt">
                <span style="color: #4ade80;">root@kaiversus:~/writeups$</span> cat {{ page.title | slugify }}.md
            </div>
            <h1>{{ page.title }}</h1>
            <div class="writeup-meta">
                [ DATE: {{ page.date | date: "%Y-%m-%d" }} ]
            </div>
        </div>

        {{ content }}
        
        <div class="post-nav-footer">
            <a href="/writeups/" class="post-nav-back">[ cd .. ] Back to Archive</a>
        </div>
    </article>

    <aside class="writeup-sidebar">
        <div class="toc-wrapper">
            <div class="toc-title">ON THIS PAGE</div>
            <div id="custom-toc"></div>
        </div>
    </aside>

</div>

<!-- Floating Mobile TOC Toggle & Drawer -->
<button id="mobile-toc-toggle" class="mobile-toc-toggle" title="Table of Contents" aria-label="Table of Contents">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="6" x2="20" y2="6"></line>
    <line x1="4" y1="12" x2="14" y2="12"></line>
    <line x1="4" y1="18" x2="18" y2="18"></line>
  </svg>
</button>

<div id="mobile-toc-overlay" class="mobile-toc-overlay"></div>

<div id="mobile-toc-drawer" class="mobile-toc-drawer">
  <div class="mobile-toc-label">ON THIS PAGE</div>
  <div id="mobile-toc-content"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 1. TẠO MỤC LỤC (TOC) DỌC
        const toc = document.getElementById('custom-toc');
        const mobileToc = document.getElementById('mobile-toc-content');
        const mobileToggle = document.getElementById('mobile-toc-toggle');
        const mobileDrawer = document.getElementById('mobile-toc-drawer');
        const mobileOverlay = document.getElementById('mobile-toc-overlay');
        const mobileClose = document.getElementById('mobile-toc-close');
        const headings = document.querySelectorAll('.writeup-content h2, .writeup-content h3, .writeup-content h4');
        
        if (headings.length > 0) {
            if (toc) {
                toc.style.display = 'flex';
                toc.style.flexDirection = 'column';
                toc.style.gap = '10px';
            }

            headings.forEach(h => {
                let headingText = (h.innerText || h.textContent).trim();
                if (!h.id) {
                    h.id = headingText.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                }
                if (toc) {
                    const a = document.createElement('a');
                    a.href = '#' + h.id;
                    a.textContent = headingText;
                    a.className = 'toc-link ' + h.tagName.toLowerCase();
                    toc.appendChild(a);
                }
                if (mobileToc) {
                    const ma = document.createElement('a');
                    ma.href = '#' + h.id;
                    ma.textContent = headingText;
                    ma.className = 'mobile-toc-link ' + h.tagName.toLowerCase();
                    ma.addEventListener('click', () => {
                        if (mobileDrawer) mobileDrawer.classList.remove('active');
                        if (mobileOverlay) mobileOverlay.classList.remove('active');
                    });
                    mobileToc.appendChild(ma);
                }
            });

            if (mobileToggle) {
                mobileToggle.addEventListener('click', () => {
                    const isOpen = mobileDrawer && mobileDrawer.classList.contains('active');
                    if (isOpen) {
                        mobileDrawer.classList.remove('active');
                        if (mobileOverlay) mobileOverlay.classList.remove('active');
                    } else {
                        if (mobileDrawer) mobileDrawer.classList.add('active');
                        if (mobileOverlay) mobileOverlay.classList.add('active');
                    }
                });
            }

            if (mobileClose) {
                mobileClose.addEventListener('click', () => {
                    if (mobileDrawer) mobileDrawer.classList.remove('active');
                    if (mobileOverlay) mobileOverlay.classList.remove('active');
                });
            }

            if (mobileOverlay) {
                mobileOverlay.addEventListener('click', () => {
                    if (mobileDrawer) mobileDrawer.classList.remove('active');
                    if (mobileOverlay) mobileOverlay.classList.remove('active');
                });
            }

            // ==========================================
            // SCROLL SPY: SÁNG MỤC LỤC KHI CUỘN
            // ==========================================
            const observerOptions = {
                root: null,
                rootMargin: '0px 0px -65% 0px',
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        document.querySelectorAll('#custom-toc a, #mobile-toc-content a').forEach(link => {
                            link.classList.remove('active');
                        });
                        const activeLinks = document.querySelectorAll(`#custom-toc a[href="#${id}"], #mobile-toc-content a[href="#${id}"]`);
                        activeLinks.forEach(link => link.classList.add('active'));
                    }
                });
            }, observerOptions);

            headings.forEach(h => observer.observe(h));

        } else {
            if (mobileToggle) mobileToggle.style.display = 'none';
        }

        // 2. WRAP TABLES
        document.querySelectorAll('.writeup-content table').forEach(t => {
            if (t.parentElement.classList.contains('table-wrapper')) return;
            const wrap = document.createElement('div');
            wrap.className = 'table-wrapper';
            wrap.style.cssText = 'display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:2em 0;max-width:100%;';
            t.parentNode.insertBefore(wrap, t);
            wrap.appendChild(t);
            t.style.margin = '0';
        });

        // 3. NÚT COPY CODE
        const codeBlocks = document.querySelectorAll('div.highlight, pre'); 
        
        codeBlocks.forEach(block => {
            if(block.tagName.toLowerCase() === 'pre' && block.parentNode.classList.contains('highlight')) return;

            block.style.position = 'relative';

            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerHTML = 'Copy';
            block.appendChild(copyBtn);

            copyBtn.addEventListener('click', () => {
                const code = block.querySelector('code') ? block.querySelector('code').innerText : block.innerText;
                navigator.clipboard.writeText(code).then(() => {
                    copyBtn.innerHTML = 'Copied!';
                    copyBtn.style.color = '#00ff41';
                    setTimeout(() => {
                        copyBtn.innerHTML = 'Copy';
                        copyBtn.style.color = '#8b949e';
                    }, 2000);
                });
            });
        });
    });
</script>
