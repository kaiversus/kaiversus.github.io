---
layout: default
---
<style>
/* ── Writeup green overrides ── */

/* Bold — green accent */
.writeup-content strong,
.writeup-content b {
  font-weight: 800;
  color: #7ee787;
}

html.light .writeup-content strong,
html.light .writeup-content b {
  color: #1a5c22;
}

/* Inline code — green tinted */
.writeup-content p code,
.writeup-content li code,
.writeup-content td code {
  background: rgba(63, 185, 80, 0.08);
  color: #7ee787;
  border: 1px solid rgba(63, 185, 80, 0.15);
}

html.light .writeup-content p code,
html.light .writeup-content li code,
html.light .writeup-content td code {
  background: rgba(30, 110, 40, 0.07);
  color: #1a5c22;
  border: 1px solid rgba(30, 110, 40, 0.12);
}

/* Table header — green */
.writeup-content th {
  background: rgba(63, 185, 80, 0.08) !important;
  color: #3fb950 !important;
}

html.light .writeup-content th {
  background: rgba(30, 110, 40, 0.07) !important;
  color: #1e6e28 !important;
}
</style>

<div class="writeup-container">
    
    <article class="writeup-content">
        <div class="writeup-header">
            <div class="terminal-prompt">
                <span style="color: #4ade80;">root@kaiversus:~/writeups$</span> cat {{ page.title | slugify }}.md
            </div>
            <h1>{{ page.title }}</h1>
            <div class="writeup-meta">
                [ DATE: {{ page.date | date: "%Y-%m-%d" }} ]
            </div>
        </div>

        {{ content }}
        
        <div style="margin-top: 50px; border-top: 1px dashed #30363d; padding-top: 20px;">
            <a href="/writeups/" style="color: #8b949e; text-decoration: none;">[ cd .. ] Back to Archive</a>
        </div>
    </article>

    <aside class="writeup-sidebar">
        <div class="toc-wrapper">
            <div class="toc-title">ON THIS PAGE</div>
            <nav id="custom-toc"></nav>
        </div>
    </aside>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 1. TẠO MỤC LỤC (TOC) DỌC
        const toc = document.getElementById('custom-toc');
        const headings = document.querySelectorAll('.writeup-content h2, .writeup-content h3');
        
        toc.style.display = 'flex';
        toc.style.flexDirection = 'column';
        toc.style.gap = '10px';

        headings.forEach(h => {
            if (!h.id) {
                h.id = h.innerText.toLowerCase().replace(/[^a-z0-9]+/g, '-');
            }
            const a = document.createElement('a');
            a.href = '#' + h.id;
            a.textContent = h.innerText;
            a.className = 'toc-link ' + h.tagName.toLowerCase();
            toc.appendChild(a);
        });

        // 2. WRAP TABLES
        document.querySelectorAll('.writeup-content table').forEach(t => {
            if (t.parentElement.classList.contains('table-wrapper')) return;
            const wrap = document.createElement('div');
            wrap.className = 'table-wrapper';
            wrap.style.cssText = 'display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:2em 0;max-width:100%;';
            t.parentNode.insertBefore(wrap, t);
            wrap.appendChild(t);
            t.style.margin = '0';
        });

        // 3. NÚT COPY CODE
        const codeBlocks = document.querySelectorAll('div.highlight, pre'); 
        
        codeBlocks.forEach(block => {
            if(block.tagName.toLowerCase() === 'pre' && block.parentNode.classList.contains('highlight')) return;

            block.style.position = 'relative';

            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerHTML = 'Copy';
            block.appendChild(copyBtn);

            copyBtn.addEventListener('click', () => {
                const code = block.querySelector('code') ? block.querySelector('code').innerText : block.innerText;
                navigator.clipboard.writeText(code).then(() => {
                    copyBtn.innerHTML = 'Copied!';
                    copyBtn.style.color = '#00ff41';
                    setTimeout(() => {
                        copyBtn.innerHTML = 'Copy';
                        copyBtn.style.color = '#8b949e';
                    }, 2000);
                });
            });
        });
    });
</script>
