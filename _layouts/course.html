<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Kaiversus</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Oxanium:wght@700;800&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">

    <!-- ① Theme manager: MUST be in <head> to apply saved theme before render -->
    <script src="{{ "/assets/js/theme.js" | relative_url }}"></script>

    <script type="text/javascript" async
      src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML">
    </script>
    
    <style>
        /* =============================================
           DARK MODE (default) — Orange accent
        ============================================= */
        :root {
            --bg-page:        #050a14;
            --text-main:      #c9d1d9;
            --border-color:   #30363d;
            --code-bg:        #161b22;
            --course-accent:  #ffaa00;
            --header-bg:      rgba(5, 10, 20, 0.95);
            --header-border:  rgba(255, 170, 0, 0.18);
            --nav-text:       rgba(255,255,255,0.85);
            --nav-logo-color: #ffaa00;
            --table-head-bg:  #21262d;
            --row-hover:      rgba(255,255,255,0.03);
        }

        /* =============================================
           LIGHT MODE — warm parchment palette
        ============================================= */
        html.light {
            --bg-page:        #faf6ee;
            --text-main:      #2a2520;
            --border-color:   #c8bfaa;
            --code-bg:        #f0e9d8;
            --course-accent:  #cc7700;
            --header-bg:      rgba(245, 240, 232, 0.97);
            --header-border:  rgba(180, 130, 40, 0.25);
            --nav-text:       #2a2520;
            --nav-logo-color: #cc7700;
            --table-head-bg:  #e8dfc8;
            --row-hover:      rgba(0,0,0,0.03);
        }

        /* ── Base ── */
        body {
            background-color: var(--bg-page) !important;
            color: var(--text-main) !important;
            font-family: 'Inter', sans-serif !important;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        canvas#cyber-matrix { display: none !important; }

        /* ── Header / Nav ── */
        header {
            position: sticky;
            top: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 60px;
            background: var(--header-bg) !important;
            border-bottom: 1px solid var(--header-border);
            backdrop-filter: blur(20px);
            transition: background 0.3s, border-color 0.3s;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            color: var(--nav-logo-color) !important;
            text-decoration: none;
            letter-spacing: 2px;
            transition: color 0.3s;
        }

        nav { display: flex; align-items: center; gap: 8px; }

        nav a {
            color: var(--nav-text) !important;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }
        nav a:hover {
            color: var(--course-accent) !important;
            background: rgba(128,128,128,0.08);
        }

        /* ── Theme toggle button ── */
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: transparent;
            cursor: pointer;
            color: var(--text-main);
            font-size: 15px;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
            margin-left: 8px;
        }
        .theme-toggle:hover {
            border-color: var(--course-accent);
            color: var(--course-accent);
            background: rgba(255,170,0,0.08);
        }

        /* ── TOC active state ── */
        #toc a.active {
            color: var(--course-accent) !important;
            border-left-color: var(--course-accent) !important;
            text-shadow: 0 0 10px rgba(255,170,0,0.3);
            padding-left: 25px;
            font-weight: bold;
        }

        /* ── Layout ── */
        .course-layout {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 250px;
            gap: 50px;
            padding: 40px 10px 100px 10px;
        }

        .course-content {
            min-width: 0;
            font-family: 'JetBrains Mono', 'Consolas', monospace !important;
            font-size: 0.95rem;
        }

        /* ── Images ── */
        .course-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px auto;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: border-color 0.3s;
        }

        /* ── Scrollable table wrapper ── */
        .table-responsive {
            overflow-x: auto;
            margin: 25px 0;
            border-radius: 8px;
            background: var(--code-bg);
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
            transition: background 0.3s;
        }
        .table-responsive::-webkit-scrollbar { height: 6px; }
        .table-responsive::-webkit-scrollbar-track { background: transparent; }
        .table-responsive::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 10px; }
        .table-responsive::-webkit-scrollbar-thumb:hover { background-color: var(--course-accent); }

        /* ── Tables ── */
        .course-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
            font-size: 0.9rem;
            min-width: 600px;
            table-layout: auto;
        }
        .course-content th {
            background-color: var(--table-head-bg);
            color: var(--course-accent);
            font-weight: 700;
            padding: 10px 15px;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
            white-space: normal !important;
            max-width: 150px;
            vertical-align: middle !important;
            transition: background-color 0.3s;
        }
        .course-content td {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px dashed rgba(128,128,128,0.2);
            color: var(--text-main);
            vertical-align: top;
            line-height: 1.5;
            word-break: break-word;
        }
        .course-content td:first-child { font-weight: 600; color: var(--text-main); }
        .course-content td:last-child { border-right: none; width: auto; }
        .course-content tr:last-child td { border-bottom: none; }
        .course-content tr:hover td { background: var(--row-hover); }

        /* ── Headings ── */
        .course-content h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--text-main) !important;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255,170,0,0.15);
            line-height: 1.2;
        }
        .course-content h2 {
            margin-top: 3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            font-family: 'Oxanium', sans-serif;
            color: var(--course-accent) !important;
            font-size: 1.8rem;
        }
        .course-content h3 {
            color: var(--text-main) !important;
            margin-top: 2rem;
            font-family: 'Orbitron', sans-serif;
        }

        /* ── Body text ── */
        .course-content p, .course-content li {
            font-family: 'JetBrains Mono', 'Consolas', monospace !important;
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-main);
            margin-bottom: 15px;
        }
        .course-content strong, .course-content b {
            color: var(--course-accent) !important;
            font-weight: 700;
        }

        /* ── Code blocks ── */
        div.highlighter-rouge {
            background-color: var(--code-bg) !important;
            border-radius: 8px;
            margin: 25px 0;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            border: none !important;
            transition: background-color 0.3s;
        }
        div.highlighter-rouge div.highlight {
            background: transparent !important;
            border: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        div.highlighter-rouge pre.highlight,
        pre.highlight {
            background: transparent !important;
            border: none !important;
            margin: 0 !important;
            padding: 20px !important;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem !important;
            line-height: 1.6;
        }
        code {
            color: var(--text-main) !important;
            text-shadow: none;
            padding: 0;
        }

        /* Inline code */
        p > code, li > code, td > code {
            background: rgba(128,128,128,0.15);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--course-accent) !important;
            font-size: 0.9em;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Light mode code text override */
        html.light code { color: #2a2520 !important; }
        html.light p > code, html.light li > code, html.light td > code {
            color: var(--course-accent) !important;
            background: rgba(0,0,0,0.07);
        }

        /* ── Copy button ── */
        .copy-btn {
            position: absolute; top: 10px; right: 10px;
            background: rgba(128,128,128,0.15);
            border: 1px solid var(--border-color); border-radius: 4px;
            color: var(--text-main); padding: 4px 10px; cursor: pointer;
            font-family: 'Inter', sans-serif; font-size: 0.75rem;
            transition: all 0.2s; z-index: 100;
            opacity: 0.7;
        }
        .copy-btn:hover {
            background: var(--course-accent);
            color: #000;
            border-color: var(--course-accent);
            font-weight: bold;
            opacity: 1;
        }

        /* ── Sidebar TOC ── */
        .course-sidebar { position: sticky; top: 80px; height: fit-content; }
        .toc-header {
            font-family: 'Orbitron', sans-serif;
            color: var(--text-main);
            font-size: 0.8rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            font-weight: bold;
            opacity: 0.5;
        }
        #toc { list-style: none; padding: 0; border-left: 2px solid var(--border-color); }
        #toc a {
            display: block;
            padding: 5px 0 5px 20px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            border-left: 2px solid transparent;
            margin-left: -2px;
            transition: 0.2s;
            opacity: 0.6;
        }
        #toc a:hover, #toc a.active {
            color: var(--course-accent) !important;
            border-left-color: var(--course-accent) !important;
            opacity: 1;
        }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .course-layout { grid-template-columns: 1fr; }
            .course-sidebar { display: none; }
            header { flex-direction: column; gap: 10px; padding: 15px !important; height: auto !important; }
            .course-content h1 { font-size: 1.8rem; }
        }
    </style>
</head>

<body>
    <div class="container" style="padding-top: 2px; padding-bottom: 2px;">
        <header>
            <a href="https://kaiversus.github.io/" class="logo">KAIVERSUS BLOG</a>
            <nav>
                <a href="/">Homepage</a>
                <a href="/about/">About_me</a>
                <a href="https://kaiversus.github.io/#writeups">Repository</a>
                <!-- ② Same toggle button ID as default.html so theme.js wires it up -->
                <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark">☀</button>
            </nav>
        </header>
    </div>

    <div class="course-layout">
        <main class="course-content">
            <div style="margin-bottom: 20px;">
                <a href="/courses/" onclick="history.back(); return false;" style="
                    color: var(--course-accent);
                    font-family: 'JetBrains Mono', monospace;
                    text-decoration: none;
                    font-size: 0.9rem;
                    opacity: 0.7;
                    transition: 0.3s;
                    display: inline-block;
                " onmouseover="this.style.opacity='1'; this.style.letterSpacing='1px'" onmouseout="this.style.opacity='0.7'; this.style.letterSpacing='0'">
                    [ Users:~$ cd .. ]
                </a>
            </div>

            <div style="margin-bottom: 30px; border-bottom: 1px dashed var(--border-color); padding-bottom: 20px;">
                <h1 style="margin: 0;">{{ page.title }}</h1>
                <div style="margin-top: 10px; color: var(--text-main); opacity: 0.5; font-family: monospace;">
                    {% if page.date %}
                    <span>UPDATED: {{ page.date | date: "%Y-%m-%d" }}</span> |
                    {% endif %}
                    <span style="color: var(--course-accent); opacity: 1;">LEVEL: {{ page.difficulty | default: "All Levels" }}</span> |
                    <span>AUTHOR: {{ page.author | default: "Kaiversus" }}</span>
                </div>
            </div>

            {{ content }}
        </main>

        <aside class="course-sidebar">
            <div class="toc-header">// COURSE_CURRICULUM</div>
            <ul id="toc"></ul>
        </aside>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            /* AUTO WRAP TABLES */
            const tables = document.querySelectorAll('.course-content table');
            tables.forEach(table => {
                if (!table.parentElement.classList.contains('table-responsive')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'table-responsive';
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                }
            });

            /* BUILD TABLE OF CONTENTS */
            const toc = document.getElementById('toc');
            const headers = document.querySelectorAll('.course-content h2, .course-content h3');
            const tocLinks = [];

            if (headers.length === 0) {
                const sidebar = document.querySelector('.course-sidebar');
                if (sidebar) sidebar.style.display = 'none';
            }

            headers.forEach(header => {
                const id = header.id || header.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
                header.id = id;
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `#${id}`;
                a.textContent = header.textContent;
                if (header.tagName === 'H3') a.style.paddingLeft = "40px";
                a.classList.add('toc-link');
                tocLinks.push(a);
                li.appendChild(a);
                toc.appendChild(li);
            });

            /* SCROLL SPY */
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        document.querySelectorAll('.toc-link').forEach(l => l.classList.remove('active'));
                        const active = document.querySelector(`.toc-link[href="#${entry.target.id}"]`);
                        if (active) active.classList.add('active');
                    }
                });
            }, { root: null, rootMargin: '0px 0px -50% 0px', threshold: 0 });

            headers.forEach(h => observer.observe(h));

            /* Highlight last item when scrolled to bottom */
            window.addEventListener('scroll', () => {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 50) {
                    document.querySelectorAll('.toc-link').forEach(l => l.classList.remove('active'));
                    if (tocLinks.length > 0) tocLinks[tocLinks.length - 1].classList.add('active');
                }
            });

            /* COPY CODE BUTTONS */
            document.querySelectorAll('.course-content pre').forEach(pre => {
                if (!pre.querySelector('code')) return;
                const wrapper = pre.closest('div.highlighter-rouge') || pre.parentElement;
                if (wrapper.querySelector('.copy-btn')) return;

                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'Copy';
                btn.onclick = () => {
                    navigator.clipboard.writeText(pre.innerText);
                    btn.textContent = 'Copied!';
                    btn.style.background = 'var(--course-accent)';
                    btn.style.color = '#000';
                    setTimeout(() => { btn.textContent = 'Copy'; btn.style.background = ''; btn.style.color = ''; }, 2000);
                };
                if (getComputedStyle(wrapper).position === 'static') wrapper.style.position = 'relative';
                wrapper.appendChild(btn);
            });
        });
    </script>
</body>
</html>
