<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }}</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Newsreader:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
<!-- Theme manager: loaded in <head> to apply saved theme before render (no flash) -->
<script src="{{ "/assets/js/theme.js" | relative_url }}"></script>
</head>
<body>

<nav>
  <a href="{{ "/" | relative_url }}" class="nav-logo">
    <span class="nav-logo-user">kaiversus</span><span class="nav-logo-at">@</span><span class="nav-logo-host">blog</span><span class="nav-logo-sym">:~$</span>
  </a>
  <div class="nav-sep"></div>
  <ul class="nav-links">
    <li><a href="{{ "/" | relative_url }}"><span class="slash">~/</span>home</a></li>
    <li><a href="{{ "/writeups/" | relative_url }}"><span class="slash">~/</span>writeups</a></li>
    <li><a href="{{ "/projects/" | relative_url }}"><span class="slash">~/</span>projects</a></li>
  </ul>
  <div class="nav-right">
    <span class="status-dot"></span>
    <span>online</span>
    <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark">☀</button>
  </div>
</nav>

{{ content }}

<footer>
  <div class="footer-brand">
    <strong>kaiversus</strong>
    <span style="color:var(--text-faint)">—</span>
    <span>Dinh Thien Bao · 52Hz</span>
  </div>
  <div class="footer-links">
    <a href="#">GitHub</a>
    <a href="#">CTFtime</a>
    <a href="#">Twitter</a>
    <a href="#">RSS</a>
  </div>
</footer>

<script src="{{ "/assets/js/cyber-bg.js" | relative_url }}"></script>
</body>
</html>
